[package]
name = "stitchviewer"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/RafalVonau/StitchViewer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
tiff = "0.11.3"
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
png = "0.18.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Response", "UrlSearchParams"] }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

[profile.release]
opt-level = 3
lto = "thin"
