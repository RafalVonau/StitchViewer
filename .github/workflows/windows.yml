name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin stitchviewer
      - uses: actions/upload-artifact@v4
        with:
          name: stitchviewer-windows
          path: target/x86_64-pc-windows-msvc/release/stitchviewer.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stitchviewer-windows
          path: dist
      - name: Create or update tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/stitchviewer.exe --clobber
          else
            gh release create "$TAG" dist/stitchviewer.exe --verify-tag --generate-notes
          fi
