name: Linux build

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libwayland-dev libxkbcommon-dev
      - name: Build Linux executable
        run: cargo build --release --locked --bin stitchviewer
      - name: Package Linux executable
        run: tar -czf stitchviewer-linux-x86_64.tar.gz -C target/release stitchviewer
      - uses: actions/upload-artifact@v4
        with:
          name: stitchviewer-linux
          path: stitchviewer-linux-x86_64.tar.gz

  release:
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stitchviewer-linux
          path: dist
      - name: Create or update tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/stitchviewer-linux-x86_64.tar.gz --clobber
          else
            gh release create "$TAG" dist/stitchviewer-linux-x86_64.tar.gz --verify-tag --generate-notes
          fi
